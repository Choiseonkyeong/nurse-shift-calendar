name: Build Android APK

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Build Web App
      run: npm run build

    - name: Check Build Directory
      run: |
        if [ -d "dist" ]; then
          echo "WEB_DIR=dist" >> $GITHUB_ENV
        elif [ -d "build" ]; then
          echo "WEB_DIR=build" >> $GITHUB_ENV
        else
          echo "WEB_DIR=dist" >> $GITHUB_ENV
        fi

    - name: Initialize Capacitor & Add Android Platform
      run: |
        npx cap init "NurseShift" "com.nurseshift.app" --web-dir ${{ env.WEB_DIR }}
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Setup Java JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 간호근무표_베타_앱
        path: android/app/build/outputs/apk/debug/app-debug.apk
