name: Deploy Supabase Functions

# 푸시 알림 발송 함수(send-shift-reminders)를 Supabase 에 배포하고 시크릿을 등록한다.
# 필요한 GitHub Secrets (없으면 배포를 건너뜀):
#   SUPABASE_ACCESS_TOKEN     : supabase.com → Account → Access Tokens
#   FIREBASE_SERVICE_ACCOUNT  : Firebase 서비스 계정 키 JSON 파일 내용 전체
#   CRON_SECRET               : 임의의 긴 랜덤 문자열 (DB Vault 의 shift_reminder_cron_secret 과 같은 값)
on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ianilyiumkvkowcnuawt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test edge function
        run: deno test supabase/functions/send-shift-reminders/handler.test.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::GitHub Secrets 미설정으로 배포를 건너뜁니다:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Set function secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          printf 'CRON_SECRET=%s\n' "$CRON_SECRET" > "$RUNNER_TEMP/fn.env"
          # 서비스 계정 JSON 을 한 줄로 압축해 dotenv 값으로 전달
          printf 'FIREBASE_SERVICE_ACCOUNT=%s\n' "$(echo "$FIREBASE_SERVICE_ACCOUNT" | jq -c .)" >> "$RUNNER_TEMP/fn.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/fn.env"
          rm -f "$RUNNER_TEMP/fn.env"

      - name: Deploy send-shift-reminders
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy send-shift-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
