name: E2E

# 브라우저 E2E 테스트: 빌드한 앱을 띄워 가짜 Supabase 로 주요 흐름 검증
# (첫 실행·동기화·사진/엑셀/.ics 가져오기·내보내기·백업·그룹 교환·계정 연결·다크 모드)
# PR 에서 한 번만 실행 (master 머지 후 다시 돌리지 않음 → 비공개 저장소 무료 한도 절약)
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 린트·단위 테스트도 PR 마다 여기서 (안드로이드 빌드는 master 에서만 돌기 때문)
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
