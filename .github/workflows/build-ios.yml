name: Build iOS

# macOS 러너는 비용이 크므로 main/master 푸시, PR, 수동 실행 시에만 동작
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'android/**'
      - 'supabase/**'
      - '**.md'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # 서명된 IPA 생성용: App Store Connect API 키로 자동 서명 (미설정 시 서명 없는 컴파일 검증만)
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build web & sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Compile (unsigned)
        if: env.ASC_KEY_P8_BASE64 == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive & export signed IPA
        if: env.ASC_KEY_P8_BASE64 != ''
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          AUTH_ARGS=(-allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH_ARGS[@]}" archive

          # master 푸시·수동 실행: App Store Connect(TestFlight)로 바로 업로드, PR: IPA 파일만 생성
          DEST=export
          if [ "${{ github.event_name }}" != "pull_request" ]; then DEST=upload; fi
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :teamID string $IOS_TEAM_ID" \
            -c "Add :signingStyle string automatic" \
            -c "Add :destination string $DEST" \
            "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH_ARGS[@]}"

      - name: Upload IPA
        if: env.ASC_KEY_P8_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore  # TestFlight 로 업로드한 경우 파일이 남지 않음
