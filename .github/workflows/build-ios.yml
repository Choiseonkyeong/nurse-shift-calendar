name: Build iOS

# macOS 러너는 사용 시간이 10배로 계산되므로 (비공개 저장소 무료 한도 월 2,000분)
#  - master 푸시: 애플 서명 키(ASC_KEY_P8_BASE64)가 등록돼 있을 때만 빌드 → TestFlight 업로드
#  - PR: ios/ 폴더를 고친 경우에만 서명 없이 컴파일 검증
#  - 수동 실행(Actions → Build iOS → Run workflow): 항상 실행
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'android/**'
      - 'supabase/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비싼 macOS 빌드 전에 실행할지만 우분투에서 판단
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "$HAS_KEY" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # 서명된 IPA 생성용: App Store Connect API 키로 자동 서명 (미설정 시 서명 없는 컴파일 검증만)
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # AdMob 앱 ID (없으면 project 의 테스트 ID)
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build web & sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Compile (unsigned)
        if: env.ASC_KEY_P8_BASE64 == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO ${ADMOB_APP_ID_IOS:+ADMOB_APP_ID=$ADMOB_APP_ID_IOS} build

      - name: Archive & export signed IPA
        if: env.ASC_KEY_P8_BASE64 != ''
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          AUTH_ARGS=(-allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${ADMOB_APP_ID_IOS:+ADMOB_APP_ID=$ADMOB_APP_ID_IOS} \
            "${AUTH_ARGS[@]}" archive

          # master 푸시·수동 실행: App Store Connect(TestFlight)로 바로 업로드, PR: IPA 파일만 생성
          DEST=export
          if [ "${{ github.event_name }}" != "pull_request" ]; then DEST=upload; fi
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :teamID string $IOS_TEAM_ID" \
            -c "Add :signingStyle string automatic" \
            -c "Add :destination string $DEST" \
            "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH_ARGS[@]}"

      - name: Upload IPA
        if: env.ASC_KEY_P8_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore  # TestFlight 로 업로드한 경우 파일이 남지 않음
