name: tmp-vendor-sheetjs
on:
  push:
    branches: [claude/practical-ptolemy-puoguo]
    paths: ['.github/workflows/tmp-vendor-sheetjs.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Download SheetJS 0.20.3, verify, commit to vendor/
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/xlsx-0.20.3.tgz https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          got="sha512-$(openssl dgst -sha512 -binary vendor/xlsx-0.20.3.tgz | base64 -w0)"
          want="sha512-oLDq3jw7AcLqKWH2AhCpVTZl8mf6X2YReP+Neh0SJUzV/BdZYjth94tG5toiMB1PPrYtxOCfaoUCkvtuH+3AJA=="
          echo "::notice title=integrity::$got"
          test "$got" = "$want"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/xlsx-0.20.3.tgz
          git commit -m "SheetJS 0.20.3 원본 파일 (cdn.sheetjs.com 에서 받아 무결성 확인)"
          git push
